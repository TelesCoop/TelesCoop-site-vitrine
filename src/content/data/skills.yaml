---
- name: Conseil
  src: "./img/svg/service-public.svg"
  items:
    - Audit technique / sécurité / performance
    - Accompagnement du CTO
  description: >
    Nous vous aidons à définir votre stratégie technologique et à prioriser vos projets numériques.
    Audit, cadrage, accompagnement de CTO : nous partons de vos usages réels pour recommander
    des solutions proportionnées à vos besoins, sans sur-ingénierie.

- name: Développement de solutions
  src: "./img/svg/development-tool.svg"
  items:
    - Nouveau produit
    - Outil métier sur-mesure
    - Digital Factory
    - E-commerce
    - Site vitrine
  description: >
    Nous développons des produits sur-mesure, co-construits avec vos équipes et vos utilisateur·ices.
    Du premier prototype à la mise en production, nous avançons par cycles courts pour confronter
    au plus tôt les solutions à leurs usages réels.
- name: Maintenance et hébergement
  src: "./img/svg/website.svg"
  items:
    - Hébergement
    - Maintenance
    - DevOps
  description: >
    Une fois votre produit en production, nous continuons à le faire vivre grâce à nos offres
    d'hébergement responsable et de maintenance. Nous concevons des solutions évolutives et
    maintenables, pour un produit qui vieillit bien et reste sobre dans la durée.
- name: No code
  src: "./img/svg/no-code.svg"
  items:
    - Création d'applications web et mobile
  description: >
    Quand le sur-mesure n'est pas justifié, le no-code permet de créer des applications web et
    mobiles rapidement et à moindre coût. Nous vous accompagnons de la conception à la mise en
    production, en vous transmettant les clés pour rester autonomes.
- name: Data science
  src: "./img/svg/data.svg"
  items:
    - Diagnostic Projet Data
    - Data engineering
    - Data analyse
    - Machine-Learning
  description: >
    Nous vous accompagnons de la collecte des données à la mise en production de vos modèles
    de machine learning. Notre objectif est que vos données éclairent réellement vos décisions
    et vos processus métiers, sans complexité inutile.
- name: Service public
  src: "./img/svg/service-public.svg"
  items:
    - Accompagnement à la transformation numérique
    - Développement de services numériques
    - Accessibilité numérique
    - Outils métiers
  description: >
    Nous accompagnons les acteurs publics dans leur transformation numérique, avec des services
    accessibles à toutes et tous et des outils métiers pensés avec les agent·es qui les utilisent.
    Le service public mérite des outils à la hauteur de ses missions.
